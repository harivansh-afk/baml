[package]
name = "baml_compiler2_rust"
version = { workspace = true }
publish = false
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Compiles BAML MIR to Rust"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
baml_base = { workspace = true }
baml_compiler2_hir = { workspace = true }
baml_compiler2_hir_ty = { workspace = true }
baml_compiler2_mir = { workspace = true }
baml_type = { workspace = true }
bex_vm_types = { workspace = true }

[dev-dependencies]
baml_compiler_diagnostics = { workspace = true }
baml_db = { workspace = true, features = [ "rust-backend" ] }
baml_test_support = { workspace = true }
bex_engine = { workspace = true }
sys_native = { workspace = true, features = [ "bundle-http", "ring-crypto" ] }
sys_ops = { workspace = true }
sys_types = { workspace = true }
borsh = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [ "macros", "rt-multi-thread" ] }
